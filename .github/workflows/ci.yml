name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Fail on critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true # TODO: remove once Next.js is upgraded past 16.3
